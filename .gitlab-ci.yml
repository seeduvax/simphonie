    variables:
        TASK_OPTVAR: "$USER_TASK_OPTVAR MODE=release ABS_REPO=$ABS_REPO DISTHOST=$DIST_HOST CC=../gcc-4.9.4/bin/gcc CPPC=../gcc-4.9.4/bin/g++"
    before_script:
        # need a more recent version of gcc
        - wget --no-check-certificate $ABS_REPO/SUSE_12_x86_64/gcc-4.9.4.SUSE_12_x86_64.tar.gz
        - tar -xf gcc-4.9.4.SUSE_12_x86_64.tar.gz

deploy_debian9:
    extends: .deploy_base
    tags:
        - debian_9

deploy_redhawk7_clang13:
    extends: .deploy_base
    tags:
        - redhawk_7
    variables:
        TASK_OPTVAR: "$USER_TASK_OPTVAR MODE=release ABS_REPO=$ABS_REPO DISTHOST=$DIST_HOST BUILDCHAIN=clang-13"

