APPNAME=simdeck
COMPANY=Sebastien Devaux
COPYRIGHT=2025
VERSION=1.0.31

VABS=3.4.26
ABS_REPO:=https://www.eduvax.net/dist

WGETFLAGS=--no-check-certificate
DISTHOST=httppub@www.eduvax.net
DISTREPO=$(DISTHOST):/home/httpd/www/dist

USELIB=ecss.smp-20250331

# list of alternate C++ buildchains
CPP_BUILDCHAINS=clang-13
ifneq ($(filter $(BUILDCHAIN),$(CPP_BUILDCHAINS)),)
# add specific suffix for C++ dependencies
CPPUSELIB_SUFFIX=_$(BUILDCHAIN)
CUSTOM_CPP_BUILDCHAIN:=true
endif
BUILDCHAIN=

CPPUNIT:=cppunit-1.14.0$(CPPUSELIB_SUFFIX)

CFLAGS+=-pthread
ifneq ($(ARCH),)
ifneq ($(filter SUSE_12_% Debian_11_% CentOS_7_%,$(ARCH)),)
CFLAGS+=-std=c++1y
else
CFLAGS+=-std=c++17
endif
endif # ifneq ($(ARCH),)
LDFLAGS+=-pthread -latomic

MODULE_TYPES_MAP+=$(PRJROOT)/abs/src/simdeck.mk:library

ADV_DEPENDS_MANAGEMENT:=false

# deactivate experimental feature for now
NOBUILD=C
